a_keywords</text><text x="811" y="144" font-size="14" fill="#243047" font-weight="400">PK kwd_no text</text><text x="811" y="170" font-size="14" fill="#243047" font-weight="400">data jsonb</text><text x="811" y="196" font-size="14" fill="#243047" font-weight="400">hit_count bigint</text><text x="811" y="222" font-size="14" fill="#243047" font-weight="400">last_hit text</text><rect x="180" y="385" width="280" height="160" rx="10" fill="white" stroke="#bac5d4"/><path d="M190 385H450Q460 385 460 395V427H180V395Q180 385 190 385" fill="#eaf0f8"/><text x="196" y="413" font-size="17" fill="#243047" font-weight="700">kra_state</text><text x="196" y="454" font-size="14" fill="#243047" font-weight="400">PK id boolean = true</text><text x="196" y="480" font-size="14" fill="#243047" font-weight="400">revision bigint</text><text x="196" y="506" font-size="14" fill="#243047" font-weight="400">columns jsonb</text><rect x="650" y="385" width="280" height="160" rx="10" fill="white" stroke="#bac5d4"/><path d="M660 385H920Q930 385 930 395V427H650V395Q650 385 660 385" fill="#eaf0f8"/><text x="666" y="413" font-size="17" fill="#243047" font-weight="700">kra_settings</text><text x="666" y="454" font-size="14" fill="#243047" font-weight="400">PK name text</text><text x="666" y="480" font-size="14" fill="#243047" font-weight="400">value jsonb</text><path d="M310 166H405" stroke="#60718c" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="145" font-size="14" fill="#243047" font-weight="400">1 : N</text><path d="M795 166H700" stroke="#60718c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="700" y="145" font-size="14" fill="#243047" font-weight="400">논리 관계</text><text x="32" y="590" font-size="15" fill="#243047" font-weight="400">실선은 FK 관계입니다. kwd_no와 Auth actor는 물리 외래키가 아닙니다.</text></g></svg>