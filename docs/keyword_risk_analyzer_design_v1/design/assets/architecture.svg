<rect width="100%" height="100%" fill="#f8fafc"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="30" y="36" font-size="23" fill="#243047" font-weight="700">KRA 서비스 구성</text><rect x="30" y="80" width="220" height="138" rx="10" fill="white" stroke="#bac5d4"/><path d="M40 80H240Q250 80 250 90V122H30V90Q30 80 40 80" fill="#eaf0f8"/><text x="46" y="108" font-size="17" fill="#243047" font-weight="700">사내 사용자</text><text x="46" y="149" font-size="14" fill="#243047" font-weight="400">브라우저 화면</text><text x="46" y="175" font-size="14" fill="#243047" font-weight="400">member 또는 admin</text><rect x="30" y="270" width="220" height="138" rx="10" fill="white" stroke="#bac5d4"/><path d="M40 270H240Q250 270 250 280V312H30V280Q30 270 40 270" fill="#eaf0f8"/><text x="46" y="298" font-size="17" fill="#243047" font-weight="700">외부 연동 시스템</text><text x="46" y="339" font-size="14" fill="#243047" font-weight="400">사용자 access token</text><text x="46" y="365" font-size="14" fill="#243047" font-weight="400">또는 연동 전용 토큰</text><rect x="315" y="80" width="265" height="138" rx="10" fill="white" stroke="#bac5d4"/><path d="M325 80H570Q580 80 580 90V122H315V90Q315 80 325 80" fill="#eaf0f8"/><text x="331" y="108" font-size="17" fill="#243047" font-weight="700">Streamlit 서버</text><text x="331" y="149" font-size="14" fill="#243047" font-weight="400">로그인과 화면 이벤트</text><text x="331" y="175" font-size="14" fill="#243047" font-weight="400">공통 매칭 함수를 직접 호출</text><rect x="315" y="270" width="265" height="138" rx="10" fill="white" stroke="#bac5d4"/><path d="M325 270H570Q580 270 580 280V312H315V280Q315 270 325 270" fill="#eaf0f8"/><text x="331" y="298" font-size="17" fill="#243047" font-weight="700">FastAPI 서버</text><text x="331" y="339" font-size="14" fill="#243047" font-weight="400">인증과 입력 검증</text><text x="331" y="365" font-size="14" fill="#243047" font-weight="400">분석 조회 및 통계 API</text><rect x="650" y="80" width="300" height="138" rx="10" fill="white" stroke="#bac5d4"/><path d="M660 80H940Q950 80 950 90V122H650V90Q650 80 660 80" 