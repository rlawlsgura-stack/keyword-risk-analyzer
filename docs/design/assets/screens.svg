<svg xmlns="http://www.w3.org/2000/svg" width="1155" height="750" viewBox="0 0 1155 750" role="img" aria-labelledby="title">
<title id="title">로그인 분석 리포트 관리자 화면 배치도</title>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#60718c"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="38" font-size="23" fill="#243047" font-weight="700">현재 화면의 정보 구조</text><rect x="25" y="75" width="535" height="270" rx="10" fill="white" stroke="#bac5d4"/><path d="M35 75H550Q560 75 560 85V117H25V85Q25 75 35 75" fill="#eaf0f8"/><text x="41" y="103" font-size="17" fill="#243047" font-weight="700">UI 00 로그인</text><text x="41" y="144" font-size="14" fill="#243047" font-weight="400">사내 계정 로그인</text><text x="41" y="170" font-size="14" fill="#243047" font-weight="400">이메일 입력</text><text x="41" y="196" font-size="14" fill="#243047" font-weight="400">비밀번호 마스킹 입력</text><text x="41" y="222" font-size="14" fill="#243047" font-weight="400">로그인 버튼</text><text x="41" y="248" font-size="14" fill="#243047" font-weight="400">실패 시 안내, role 확인 후 진입</text><rect x="595" y="75" width="535" height="270" rx="10" fill="white" stroke="#bac5d4"/><path d="M605 75H1120Q1130 75 1130 85V117H595V85Q595 75 605 75" fill="#eaf0f8"/><text x="611" y="103" font-size="17" fill="#243047" font-weight="700">UI 10과 UI 11 분석</text><text x="611" y="144" font-size="14" fill="#243047" font-weight="400">일반 사용자: 분석하기 | 리포트</text><text x="611" y="170" font-size="14" fill="#243047" font-weight="400">원문 입력  최대 20,000자</text><text x="611" y="196" font-size="14" fill="#243047" font-weight="400">키워드 찾는 방식과 적용 규칙 요약</text><text x="611" y="222" font-size="14" fill="#243047" font-weight="400">분석 실행  고유 코드 수와 결과 표</text><text x="611" y="248" font-size="14" fill="#243047" font-weight="400">원문 하이라이트와 CSV 다운로드</text><rect x="25" y="395" width="535" height="270" rx="10" fill="white" stroke="#bac5d4"/><path d="M35 395H550Q560 395 560 405V437H25V405Q25 395 35 395" fill="#eaf0f8"/><text x="41" y="423" font-size="17" fill="#243047" font-weight="700">UI 20과 UI 21 리포트</text><text x="41" y="464" font-size="14" fill="#243047" font-weight="400">최근 7일 Top N  기본 10</text><text x="41" y="490" font-size="14" fill="#243047" font-weight="400">시작과 종료 기간</text><text x="41" y="516" font-size="14" fill="#243047" font-weight="400">키워드별 주간 조회수 표</text><text x="41" y="542" font-size="14" fill="#243047" font-weight="400">리포트 CSV 다운로드</text><text x="41" y="568" font-size="14" fill="#243047" font-weight="400">관리자용 누적 초기화와 주간 제외</text><rect x="595" y="395" width="535" height="270" rx="10" fill="white" stroke="#bac5d4"/><path d="M605 395H1120Q1130 395 1130 405V437H595V405Q595 395 605 395" fill="#eaf0f8"/><text x="611" y="423" font-size="17" fill="#243047" font-weight="700">UI 30~32와 UI 40 관리</text><text x="611" y="464" font-size="14" fill="#243047" font-weight="400">admin 전용: 키워드 관리 | 사용자 관리</text><text x="611" y="490" font-size="14" fill="#243047" font-weight="400">공통 분석 규칙 편집과 저장</text><text x="611" y="516" font-size="14" fill="#243047" font-weight="400">키워드 추가·편집·업로드·삭제</text><text x="611" y="542" font-size="14" fill="#243047" font-weight="400">드롭다운과 템플릿 다운로드</text><text x="611" y="568" font-size="14" fill="#243047" font-weight="400">계정 목록 조회와 member/admin 역할 지정</text><text x="28" y="715" font-size="15" fill="#243047" font-weight="400">위 배치는 화면 설계용 도식입니다. 실제 캡처나 픽셀 단위 시안이 아닙니다.</text></g></svg>