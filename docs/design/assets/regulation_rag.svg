<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="600" viewBox="0 0 1060 600" role="img" aria-labelledby="title">
<title id="title">규정 검색 추가 계획과 후속 AI 검토 구성</title>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#60718c"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="30" y="36" font-size="23" fill="#243047" font-weight="700">규정 근거 검색 도입안 — 운영 기능 미연결</text><rect x="30" y="75" width="280" height="165" rx="10" fill="white" stroke="#bac5d4"/><path d="M40 75H300Q310 75 310 85V117H30V85Q30 75 40 75" fill="#eaf0f8"/><text x="46" y="103" font-size="17" fill="#243047" font-weight="700">기존 Streamlit 화면 확장</text><text x="46" y="144" font-size="14" fill="#243047" font-weight="400">국내 화장품·식품·건강기능식품</text><text x="46" y="170" font-size="14" fill="#243047" font-weight="400">제품군 하나와 검사 기준일 선택</text><text x="46" y="196" font-size="14" fill="#243047" font-weight="400">키워드 검사와 규정 검색 분리</text><rect x="390" y="75" width="280" height="165" rx="10" fill="white" stroke="#bac5d4"/><path d="M400 75H660Q670 75 670 85V117H390V85Q390 75 400 75" fill="#eaf0f8"/><text x="406" y="103" font-size="17" fill="#243047" font-weight="700">별도 FastAPI — 추가 계획</text><text x="406" y="144" font-size="14" fill="#243047" font-weight="400">사용자 인증과 호출 제한</text><text x="406" y="170" font-size="14" fill="#243047" font-weight="400">검색 결과·원문 위치 반환</text><text x="406" y="196" font-size="14" fill="#243047" font-weight="400">키워드 API와 장애 분리</text><rect x="750" y="75" width="280" height="165" rx="10" fill="white" stroke="#bac5d4"/><path d="M760 75H1020Q1030 75 1030 85V117H750V85Q750 75 760 75" fill="#eaf0f8"/><text x="766" y="103" font-size="17" fill="#243047" font-weight="700">외부 모델 API — 계획</text><text x="766" y="144" font-size="14" fill="#243047" font-weight="400">관리형 임베딩 API 우선 평가</text><text x="766" y="170" font-size="14" fill="#243047" font-weight="400">BGE-M3는 검색 품질 비교 후보</text><text x="766" y="196" font-size="14" fill="#243047" font-weight="400">생성 API는 검색 검증 후 연결</text><rect x="390" y="325" width="280" height="190" rx="10" fill="white" stroke="#bac5d4"/><path d="M400 325H660Q670 325 670 335V367H390V335Q390 325 400 325" fill="#eaf0f8"/><text x="406" y="353" font-size="17" fill="#243047" font-weight="700">Supabase — 추가 계획</text><text x="406" y="394" font-size="14" fill="#243047" font-weight="400">승인된 문서·조항·임베딩</text><text x="406" y="420" font-size="14" fill="#243047" font-weight="400">국가·제품군·조항 적용일 필터</text><text x="406" y="446" font-size="14" fill="#243047" font-weight="400">어휘 + 벡터 검색 순위 결합</text><text x="406" y="472" font-size="14" fill="#243047" font-weight="400">최종 판정 대신 관련 근거 반환</text><rect x="30" y="325" width="280" height="190" rx="10" fill="white" stroke="#bac5d4"/><path d="M40 325H300Q310 325 310 335V367H30V335Q30 325 40 325" fill="#eaf0f8"/><text x="46" y="353" font-size="17" fill="#243047" font-weight="700">관리자 자료 준비</text><text x="46" y="394" font-size="14" fill="#243047" font-weight="400">공식 원문과 버전 확보</text><text x="46" y="420" font-size="14" fill="#243047" font-weight="400">페이지·표·단서·예외 검수</text><text x="46" y="446" font-size="14" fill="#243047" font-weight="400">적용 기간과 출처 승인</text><text x="46" y="472" font-size="14" fill="#243047" font-weight="400">배치 임베딩 후 근거 묶음 전환</text><rect x="750" y="325" width="280" height="190" rx="10" fill="white" stroke="#bac5d4"/><path d="M760 325H1020Q1030 325 1030 335V367H750V335Q750 325 760 325" fill="#eaf0f8"/><text x="766" y="353" font-size="17" fill="#243047" font-weight="700">후속 근거 기반 검토</text><text x="766" y="394" font-size="14" fill="#243047" font-weight="400">외부 API 전송 허용 확인 완료</text><text x="766" y="420" font-size="14" fill="#243047" font-weight="400">원문과 근거만으로 설명 생성</text><text x="766" y="446" font-size="14" fill="#243047" font-weight="400">인용·출력 형식 서버 검증</text><text x="766" y="472" font-size="14" fill="#243047" font-weight="400">추가 정보 확인과 담당자 검토</text><path d="M310 150H385" fill="none" stroke="#60718c" stroke-width="2" marker-end="url(#arrow)"/><path d="M670 150H745" fill="none" stroke="#60718c" stroke-width="2" marker-end="url(#arrow)"/><path d="M530 240V320" fill="none" stroke="#60718c" stroke-width="2" marker-end="url(#arrow)"/><path d="M310 420H385" fill="none" stroke="#60718c" stroke-width="2" marker-end="url(#arrow)"/><path d="M670 420H745" fill="none" stroke="#60718c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="30" y="565" font-size="15" fill="#243047" font-weight="400">검색 유사도는 위반 확률이 아닙니다. 자료의 효력·적용 조건·시행일과 제품 정보를 함께 확인합니다.</text></g></svg>