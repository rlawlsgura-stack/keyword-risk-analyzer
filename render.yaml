services:
  - type: web
    name: keyword-risk-ui
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.lock.txt
    startCommand: python -m streamlit run keyword_app2_fixed270.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
  - type: web
    name: keyword-risk-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.lock.txt
    startCommand: python -m uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: API_ACCESS_TOKEN
        sync: false
