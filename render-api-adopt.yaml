# Adopt the existing production API service without changing its environment values.
services:
  - type: web
    name: keyword-risk-api2
    runtime: python
    repo: https://github.com/rlawlsgura-stack/keyword-risk-analyzer.git
    branch: main
    region: ohio
    plan: free
    numInstances: 1
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.lock.txt -r requirements-ocr.txt
    startCommand: python -m uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
